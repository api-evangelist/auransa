aid: auransa
name: Auransa
description: >-
  Auransa Inc. is a clinical-stage, AI-native biopharmaceutical company based in
  Palo Alto, California, founded in 2014 by Pek Lum. Auransa uses its proprietary
  SMarTR Engine — a hypothesis-free machine learning platform that mines human
  disease data such as RNA transcriptome and gene-expression profiles — to
  discover novel small-molecule therapeutics without starting from a predefined
  drug target. The company has analyzed more than 500,000 gene-expression profiles
  across roughly 70 diseases to identify molecular disease subtypes and match them
  to candidate compounds. Its lead program, AU-409, is a first-in-human Phase 1
  candidate for liver cancer (hepatocellular carcinoma), with additional pipeline
  work in heart-safe chemotherapy and other oncology indications. Auransa is a
  DCVC / DCVC Bio portfolio company, also backed by Lux Capital, 11.2 Capital, and
  Harmonix Fund. Auransa is a private drug-discovery company and does not publish a
  public API, developer portal, or SDK; this profile captures its identity and web
  presence in the API Evangelist network.
